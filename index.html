<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Reading Notes</title>
    <meta
      name="description"
      content="A bilingual paper reading notebook with main content, innovations, implementation notes, categories, and links."
    />
    <link rel="stylesheet" href="styles.css?v=20261016-catalog" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
          processEscapes: true,
        },
      };
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
    ></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H3zM21 4h-6a3 3 0 0 0-3 3v14a4 4 0 0 1 4-3h5z"/></svg></span>
        <h1 data-i18n="siteTitle">论文阅读笔记</h1>
        <p class="brand-caption" data-i18n="siteLabel">Paper Reading Notes</p>
      </div>

      <div class="header-actions" aria-label="language switcher">
        <button class="tool-button" type="button" id="prompt-button">精读 Prompt</button>
        <button class="lang-button is-active" type="button" data-lang="zh">中文</button>
        <button class="lang-button" type="button" data-lang="en">English</button>
      </div>
    </header>

    <main class="shell" id="app-shell">
      <button class="edge-toggle sidebar-restore" id="sidebar-restore" type="button">›</button>
      <aside class="sidebar" id="sidebar" aria-label="paper navigation">
        <div class="sidebar-header">
          <p class="sidebar-label" data-i18n="myLibrary">我的论文库</p>
          <button class="panel-toggle" id="sidebar-toggle" type="button">‹</button>
        </div>
        <nav class="category-nav" id="category-nav" aria-label="categories"></nav>

        <section class="sidebar-footer" aria-label="statistics">
          <div class="update-badge" id="update-badge" aria-label="last updated"></div>
          <div class="quick-stats">
            <div>
              <span id="paper-count">0</span>
              <small data-i18n="papers">篇论文</small>
            </div>
            <div>
              <span id="category-count">0</span>
              <small data-i18n="topics">个方向</small>
            </div>
          </div>
        </section>
      </aside>
      <div
        class="layout-resizer sidebar-resizer"
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        tabindex="0"
      ></div>

      <section class="content-area">
        <div class="toolbar">
          <div>
            <p class="section-kicker" data-i18n="libraryLabel">论文库 / 研究方向</p>
            <h2 id="view-title">全部论文</h2>
            <p id="view-description" class="view-description" hidden></p>
          </div>
          <label class="search-box" for="paper-search">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>
            <span class="sr-only" data-i18n="searchLabel">搜索论文</span>
            <input id="paper-search" class="search-input" type="search" autocomplete="off" />
            <kbd aria-hidden="true">⌘ K</kbd>
          </label>
        </div>
        <div class="filter-bar">
          <div class="filter-controls">
            <label class="filter-control"><span class="sr-only" data-i18n="readingStatus">阅读状态</span><select id="status-filter"></select></label>
            <label class="filter-control"><span class="sr-only" data-i18n="year">年份</span><select id="year-filter"></select></label>
            <button class="reset-filters" id="reset-filters" type="button" data-i18n="clearFilters" hidden>清除筛选</button>
          </div>
          <label class="sort-control"><span data-i18n="sortLabel">排序</span><select id="sort-order"></select></label>
        </div>
        <div class="catalog-heading"><h3 data-i18n="paperCollection">论文集</h3><p id="result-count" class="result-count" role="status" aria-live="polite"></p></div>
        <section class="paper-list" id="paper-list" aria-label="papers"></section>
      </section>
    </main>

    <dialog class="paper-dialog" id="paper-dialog" aria-labelledby="paper-dialog-title">
      <div class="reader-toolbar"><span data-i18n="readingNotes">阅读笔记</span><button class="icon-close" id="detail-close" type="button" autofocus aria-label="关闭阅读详情">×</button></div>
      <article class="paper-detail" id="paper-detail" aria-label="paper detail"></article>
    </dialog>

    <div class="prompt-modal" id="prompt-modal" hidden>
      <button class="prompt-backdrop" type="button" data-prompt-close aria-label="close"></button>
      <section class="prompt-dialog" role="dialog" aria-modal="true" aria-labelledby="prompt-modal-title">
        <div class="prompt-dialog-header">
          <div>
            <p class="section-kicker">Prompt</p>
            <h2 id="prompt-modal-title" data-i18n="promptModalTitle">论文精读 Prompt</h2>
          </div>
          <button class="icon-close" type="button" data-prompt-close aria-label="close">×</button>
        </div>
        <p class="prompt-dialog-copy" data-i18n="promptModalDescription">
          四套 Prompt 均加入简短的论文定位要求，再按需精读或随读答疑。
        </p>
        <div class="prompt-card-list" id="prompt-card-list"></div>
        <p class="prompt-status" id="prompt-status" aria-live="polite"></p>
      </section>
    </div>

    <script src="app.js?v=20261029-four-prompts"></script>
  </body>
</html>
